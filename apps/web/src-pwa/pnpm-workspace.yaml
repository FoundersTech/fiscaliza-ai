# This file exists to force pnpm install deps here, regardless of upper workspaces
# https://pnpm.io/settings

# O arquivo precisa ter ao menos uma chave: só com comentários, o Dependabot falha ao lê-lo
# ("undefined method '[]' for nil" em workspace_catalog_dependencies).
packages:
  - .

# Avisos de segurança ignorados no `pnpm audit`, cada um com o motivo. Revise quando sair correção.
auditConfig:
  ignoreGhsas:
    # picomatch <=4.0.7, ReDoS com extglobs repetidos, ainda sem versão corrigida. Só chega por
    # ferramentas de build e lint, com padrões de glob vindos da configuração, nunca de usuários.
    - GHSA-fc5q-39xc-vjpf

