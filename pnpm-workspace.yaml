packages:
  - apps/*
  - packages/*
# apps/web/src-pwa fica fora: o Quasar instala as dependências do service worker
# nessa pasta como projeto separado (lockfile próprio) no `quasar prepare` e no build.

# Pacotes que podem rodar scripts de instalação (https://pnpm.io/settings)
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  esbuild: true
  lightningcss: true
  prisma: true
  rolldown: true
  unrs-resolver: true
  # Telemetria: não roda.
  '@scarf/scarf': false
  # Aceleração nativa opcional do msgpackr (BullMQ); sem ela, usa a versão em JS.
  msgpackr-extract: false
