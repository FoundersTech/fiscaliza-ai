packages:
  - apps/*
  - packages/*
# apps/web/src-pwa fica fora: o Quasar instala as dependências do service worker
# nessa pasta como projeto separado (lockfile próprio) no `quasar prepare` e no build.

# Pacotes que podem rodar scripts de instalação (https://pnpm.io/settings)
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  esbuild: true
  lightningcss: true
  prisma: true
  rolldown: true
  unrs-resolver: true
  # Telemetria: não roda.
  '@scarf/scarf': false
  # Aceleração nativa opcional do msgpackr (BullMQ); sem ela, usa a versão em JS.
  msgpackr-extract: false

# Avisos de segurança ignorados no `pnpm audit`, cada um com o motivo. Revise quando sair correção.
auditConfig:
  ignoreGhsas:
    # picomatch <=4.0.7, ReDoS com extglobs repetidos, ainda sem versão corrigida. Só chega por
    # ferramentas de build e lint, com padrões de glob vindos da configuração, nunca de usuários.
    - GHSA-fc5q-39xc-vjpf

