name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um novo push na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificacao:
    name: Lint, typecheck e testes de unidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # O postinstall da API roda `prisma generate`, necessário para o typecheck.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integracao:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fiscaliza
          POSTGRES_PASSWORD: fiscaliza
          POSTGRES_DB: fiscaliza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fiscaliza -d fiscaliza"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fiscaliza:fiscaliza@localhost:5432/fiscaliza
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int

  contratos:
    name: Contratos da API atualizados
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contratos:gerar
      - name: Conferir se os contratos versionados batem com a API
        run: |
          if ! git diff --exit-code -- packages/contratos; then
            echo "::error::Os contratos estão desatualizados. Rode 'pnpm contratos:gerar' e commite packages/contratos."
            exit 1
          fi

  auditoria:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm audit --audit-level high
      # O service worker do PWA tem lockfile próprio (apps/web/src-pwa).
      - run: pnpm audit --audit-level high
        working-directory: apps/web/src-pwa
